<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    댕사주 아이콘 스프라이트 (직접 제작). 사용: <svg><use href="./assets/icons/sprite.svg#el-fire"/></svg>
    - el-*: 오행 아이콘. fill="currentColor" 라서 부모 color(.text-wood 등)를 따른다.
    - menu-*: 메인 메뉴 카드 아이콘(듀오톤, 고정 색).
    - streak: 연속 출석 메달. 메달 색은 currentColor(단계별 색), 불꽃은 흰색.
    - chevron-right / close: 앱인토스 design 가이드 기본 아이콘과 같은 형태(stroke currentColor).
  -->

  <!-- 목(木): 새싹 -->
  <symbol id="el-wood" viewBox="0 0 24 24">
    <path d="M12 21.5v-9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
    <path fill="currentColor" d="M11.6 13.4C6.9 13.6 4.2 11 4 6.4c4.7-.2 7.4 2.4 7.6 7Z"/>
    <path fill="currentColor" d="M12.4 11.2c.1-4.9 2.9-7.6 7.6-7.7-.1 4.9-2.9 7.6-7.6 7.7Z"/>
  </symbol>

  <!-- 화(火): 불꽃 -->
  <symbol id="el-fire" viewBox="0 0 24 24">
    <g transform="translate(12 12) scale(1.22) translate(-12 -11.6)">
      <path fill="currentColor" d="M12.6 2.2c.9 3.3-.6 5.3-2.3 7.2C8.6 11.3 6.8 13 6.8 15.8a5.2 5.2 0 0 0 10.4 0c0-2.5-1.2-4.4-2.6-5.9-.1 1.5-.8 2.6-1.9 3.1.6-3.9-.3-7.6-.1-10.8Z"/>
      <path fill="#fff" fill-opacity=".45" d="M12 13.6c1.6 1.4 2.4 2.6 2.4 3.9a2.4 2.4 0 0 1-4.8 0c0-1.3.9-2.6 2.4-3.9Z"/>
    </g>
  </symbol>

  <!-- 토(土): 두 봉우리 산 -->
  <symbol id="el-earth" viewBox="0 0 24 24">
    <path fill="currentColor" d="M1.8 19.6 8.6 7.9a1 1 0 0 1 1.7 0l3.3 5.6 2-3a1 1 0 0 1 1.7 0l4.9 9.1Z"/>
    <path fill="#fff" fill-opacity=".45" d="m8.6 7.9 1.7 0 2 3.4-1.8 1.2-1-1.3-1.6 1.1Z"/>
  </symbol>

  <!-- 금(金): 엽전 -->
  <symbol id="el-metal" viewBox="0 0 24 24">
    <path fill="currentColor" fill-rule="evenodd" d="M12 2.6a9.4 9.4 0 1 1 0 18.8 9.4 9.4 0 0 1 0-18.8Zm-2.7 6.7v5.4h5.4V9.3Z"/>
    <circle cx="12" cy="12" r="7.3" fill="none" stroke="#1E1B4B" stroke-opacity=".35" stroke-width="1"/>
  </symbol>

  <!-- 수(水): 물방울 -->
  <symbol id="el-water" viewBox="0 0 24 24">
    <path fill="currentColor" d="M12 2.6c3.6 4.3 6.2 8 6.2 11.5a6.2 6.2 0 0 1-12.4 0c0-3.5 2.6-7.2 6.2-11.5Z"/>
    <path d="M9.2 14.6a3 3 0 0 0 2.4 3" fill="none" stroke="#fff" stroke-opacity=".6" stroke-width="1.6" stroke-linecap="round"/>
  </symbol>

  <!-- 메뉴: 일반 댕사주 (강아지 얼굴 + 초승달) -->
  <symbol id="menu-saju" viewBox="0 0 48 48">
    <path fill="#FDE68A" d="M38.6 5.4a7.4 7.4 0 1 0 5.2 11.9 6.2 6.2 0 0 1-5.2-11.9Z"/>
    <g transform="translate(24 27) scale(1.14) translate(-24 -27)">
    <ellipse cx="13.2" cy="21.5" rx="5.2" ry="9" transform="rotate(24 13.2 21.5)" fill="#7C3AED"/>
    <ellipse cx="34.8" cy="21.5" rx="5.2" ry="9" transform="rotate(-24 34.8 21.5)" fill="#7C3AED"/>
    <circle cx="24" cy="26.5" r="12.5" fill="#C4B5FD"/>
    <ellipse cx="24" cy="31.5" rx="6.6" ry="5.2" fill="#EDE9FE"/>
    <circle cx="19.4" cy="24.6" r="1.9" fill="#1E1B4B"/>
    <circle cx="28.6" cy="24.6" r="1.9" fill="#1E1B4B"/>
    <path fill="#1E1B4B" d="M21.6 29.4c0-.9 1.1-1.5 2.4-1.5s2.4.6 2.4 1.5c0 1-1.2 2.1-2.4 2.1s-2.4-1.1-2.4-2.1Z"/>
    <path d="M24 31.5v1.7m0 0c-.9 1-2.2 1.2-3.2.6m3.2-.6c.9 1 2.2 1.2 3.2.6" fill="none" stroke="#1E1B4B" stroke-width="1.3" stroke-linecap="round"/>
    </g>
  </symbol>

  <!-- 메뉴: 댕궁합 (하트 + 발바닥) -->
  <symbol id="menu-match" viewBox="0 0 48 48">
    <path fill="#F472B6" d="M24 42.5S6.5 32.3 6.5 19.4A9.6 9.6 0 0 1 24 13.9a9.6 9.6 0 0 1 17.5 5.5C41.5 32.3 24 42.5 24 42.5Z"/>
    <path fill="#fff" fill-opacity=".25" d="M14.8 15.4a5.5 5.5 0 0 0-4.6 5.9c0 .8.7 1.3 1.4 1.1.6-.1 1-.7 1-1.3a3.2 3.2 0 0 1 2.7-3.4c.7-.1 1.1-.7 1-1.4-.1-.6-.8-1-1.5-.9Z"/>
    <g fill="#fff">
      <ellipse cx="24" cy="29.6" rx="5.4" ry="4.6"/>
      <ellipse cx="17.2" cy="23.6" rx="2.2" ry="2.8" transform="rotate(-18 17.2 23.6)"/>
      <ellipse cx="21.6" cy="20.4" rx="2.2" ry="2.9" transform="rotate(-6 21.6 20.4)"/>
      <ellipse cx="26.4" cy="20.4" rx="2.2" ry="2.9" transform="rotate(6 26.4 20.4)"/>
      <ellipse cx="30.8" cy="23.6" rx="2.2" ry="2.8" transform="rotate(18 30.8 23.6)"/>
    </g>
  </symbol>

  <!-- 메뉴: 댕친 궁합 (발바닥 두 개) -->
  <symbol id="menu-friend" viewBox="0 0 48 48">
    <g fill="#C4B5FD" transform="rotate(-14 17 27)">
      <ellipse cx="17" cy="31.2" rx="7" ry="6"/>
      <ellipse cx="8.6" cy="23.6" rx="2.8" ry="3.6" transform="rotate(-18 8.6 23.6)"/>
      <ellipse cx="14.2" cy="19.6" rx="2.8" ry="3.7" transform="rotate(-6 14.2 19.6)"/>
      <ellipse cx="20.2" cy="19.6" rx="2.8" ry="3.7" transform="rotate(6 20.2 19.6)"/>
      <ellipse cx="25.6" cy="23.6" rx="2.8" ry="3.6" transform="rotate(18 25.6 23.6)"/>
    </g>
    <g fill="#FDE68A" transform="rotate(14 32 20)">
      <ellipse cx="32" cy="24.2" rx="6" ry="5.1"/>
      <ellipse cx="24.8" cy="17.8" rx="2.4" ry="3.1" transform="rotate(-18 24.8 17.8)"/>
      <ellipse cx="29.6" cy="14.4" rx="2.4" ry="3.2" transform="rotate(-6 29.6 14.4)"/>
      <ellipse cx="34.6" cy="14.4" rx="2.4" ry="3.2" transform="rotate(6 34.6 14.4)"/>
      <ellipse cx="39.2" cy="17.8" rx="2.4" ry="3.1" transform="rotate(18 39.2 17.8)"/>
    </g>
  </symbol>

  <!-- 연속 출석 메달: 메달 색은 currentColor, 불꽃은 흰색 -->
  <symbol id="streak" viewBox="0 0 24 24">
    <path fill="currentColor" fill-opacity=".55" d="m7.6 14.5-2.3 7.1 3.1-1.3 2 2.6 1.8-6.4Zm8.8 0 2.3 7.1-3.1-1.3-2 2.6-1.8-6.4Z"/>
    <circle cx="12" cy="9.6" r="7.6" fill="currentColor"/>
    <path fill="#fff" d="M12.3 4.6c.5 1.9-.3 3-1.3 4.1-1 1.1-2 2.1-2 3.7a3 3 0 0 0 6 0c0-1.4-.7-2.5-1.5-3.4-.1.9-.5 1.5-1.1 1.8.3-2.2-.2-4.4-.1-6.2Z"/>
  </symbol>

  <!-- 리스트·카드 진입 꺾쇠 / 닫기 (앱인토스 design 가이드 기본 아이콘과 같은 형태) -->
  <symbol id="chevron-right" viewBox="0 0 24 24">
    <path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="close" viewBox="0 0 24 24">
    <path d="M6 6 L18 18 M18 6 L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
</svg>
